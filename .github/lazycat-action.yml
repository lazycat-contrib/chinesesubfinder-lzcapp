version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: chinesesubfinder

build:
  toolchains: []
  run_buildscript: false

images:
  - id: chinesesubfinder
    target: service
    service: chinesesubfinder
    source: docker.io/allanpk716/chinesesubfinder
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ChineseSubFinder
    summary: 自动化中文字幕下载器
